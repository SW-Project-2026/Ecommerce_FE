name: Deploy DaOn Frontend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: jiwoodd/daon:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Oracle Cloud 서버에 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            docker pull jiwoodd/daon:latest
            docker stop daon-frontend || true
            docker rm   daon-frontend || true
            docker run -d \
              --name daon-frontend \
              --restart always \
              -p 80:80 \
              jiwoodd/daon:latest
            docker image prune -f